<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oxford Milonga</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #141016;
  --panel: #1f1824;
  --accent: #b06aa9;
  --accent-soft: #d6a3cf;
  --text: #f2edf3;
  --muted: #b7aebc;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.4;
}

img.header-img {
  width: 100%;
  height: auto;
  display: block;
}

.container {
  max-width: 680px;
  margin: auto;
  padding: 1rem;
}

.card {
  background: var(--panel);
  border-radius: 10px;
  padding: 0.9rem 1rem;
  margin-bottom: 0.7rem;
}

.card strong {
  color: var(--accent-soft);
}

.next {
  border-left: 4px solid var(--accent);
}

.notice {
  background: #2a1a2d;
  border-left: 4px solid var(--accent);
}

a {
  color: var(--accent-soft);
  text-decoration: none;
}

a:hover { text-decoration: underline; }

.footer-links {
  margin-top: 0.5rem;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  padding: 1rem 0 1.5rem;
}

/* Responsive adjustments */
@media (max-width: 480px) {
  body {
    font-size: 14px;
  }
  .container {
    padding: 0.8rem;
  }
  .card {
    padding: 0.7rem 0.9rem;
    margin-bottom: 0.5rem;
  }
}
</style>
</head>

<body>

<img src="https://user.fm/files/v2-058096dbaec77a53d080b2e23ab74ff6/OMheader1.jpg" alt="Oxford Milonga" class="header-img">

<div class="container">

  <div class="card next" data-field="nextMilonga"></div>
  <div class="card" data-field="dates"></div>
  <div class="card notice" data-field="trafficNote"></div>
  <div class="card" data-field="venue"></div>
  <div class="card" data-field="parking"></div>
  <div class="card" data-field="thanks"></div>
  <div class="card" data-field="etiquette"></div>
  <div class="card" data-field="contact"></div>

</div>

<footer id="footer"></footer>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

<script>
  // --- Step 1: Initialize Supabase ---
  const SUPABASE_URL = "YOUR_SUPABASE_URL"; https://nruzenoiukcnskdparwg.supabase.com
  const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ydXplbm9pdWtjbnNrZHBhcndnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0ODUxMTYsImV4cCI6MjA4NDA2MTExNn0.cQBPQyOmd4dj1enLtvrN9WFfDyTdCZJmS__BQqpjy9c
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --- Step 2: Load content ---
  async function loadContent() {
    const { data, error } = await supabase
      .from("content")
      .select("*")
      .single();

    if (error) {
      console.error("Error loading content:", error);
      return;
    }

    document.querySelectorAll("[data-field]").forEach(el => {
      const key = el.dataset.field;
      el.innerHTML = data[key] || "";
    });

    // footer separately
    document.getElementById("footer").innerHTML = data.footer || "";
  }

  loadContent();
</script>

</body>
</html>
