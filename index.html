<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oxford Milonga</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #141016;
  --panel: #1f1824;
  --accent: #b06aa9;
  --accent-soft: #d6a3cf;
  --text: #f2edf3;
  --muted: #b7aebc;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.4;
}

img.header-img {
  width: 100%;
  height: auto;
  display: block;
}

.container {
  max-width: 680px;
  margin: auto;
  padding: 1rem;
}

.card {
  background: var(--panel);
  border-radius: 10px;
  padding: 0.9rem 1rem;
  margin-bottom: 0.7rem;
}

.card strong {
  color: var(--accent-soft);
}

.next {
  border-left: 4px solid var(--accent);
}

.notice {
  background: #2a1a2d;
  border-left: 4px solid var(--accent);
}

a {
  color: var(--accent-soft);
  text-decoration: none;
}

a:hover { text-decoration: underline; }

.footer-links {
  margin-top: 0.5rem;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 0.8rem;
  padding: 1rem 0 1.5rem;
}

@media (max-width: 480px) {
  body { font-size: 14px; }
  .container { padding: 0.8rem; }
  .card { padding: 0.7rem 0.9rem; margin-bottom: 0.5rem; }
}

#login-area { text-align: center; margin: 1rem 0; }
#login-area button { margin: 0 0.5rem; padding: 0.3rem 0.6rem; font-size: 14px; }

#save-btn { display: none; margin-top: 1rem; padding: 0.3rem 0.6rem; font-size: 14px; background: var(--accent); color: #fff; border: none; border-radius: 5px; cursor: pointer; }
</style>
</head>

<body>

<img src="https://user.fm/files/v2-058096dbaec77a53d080b2e23ab74ff6/OMheader1.jpg" alt="Oxford Milonga" class="header-img">

<div id="login-area">
  <button id="login-btn">Log In</button>
  <button id="logout-btn" style="display:none;">Log Out</button>
  <button id="save-btn">Save Changes</button>
</div>

<div class="container">
  <div class="card next" data-field="nextMilonga"></div>
  <div class="card" data-field="dates"></div>
  <div class="card notice" data-field="trafficNote"></div>
  <div class="card" data-field="venue"></div>
  <div class="card" data-field="parking"></div>
  <div class="card" data-field="thanks"></div>
  <div class="card" data-field="etiquette"></div>
  <div class="card" data-field="contact"></div>
</div>

<footer id="footer"></footer>

<!-- Supabase JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/supabase.min.js"></script>

<script>
  // --- Initialize Supabase ---
  const SUPABASE_URL = "https://nruzenoiukcnskdparwg.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5ydXplbm9pdWtjbnNrZHBhcndnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0ODUxMTYsImV4cCI6MjA4NDA2MTExNn0.cQBPQyOmd4dj1enLtvrN9WFfDyTdCZJmS__BQqpjy9c";
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginBtn = document.getElementById("login-btn");
  const logoutBtn = document.getElementById("logout-btn");
  const saveBtn = document.getElementById("save-btn");

  // --- Load content ---
  async function loadContent() {
    const { data, error } = await supabase
      .from("content")
      .select("*")
      .single();

    if (error) { console.error("Error loading content:", error); return; }

    document.querySelectorAll("[data-field]").forEach(el => {
      const key = el.dataset.field;
      el.innerHTML = data[key] || "";
    });

    document.getElementById("footer").innerHTML = data.footer || "";
  }

  loadContent();

  // --- Login/logout ---
  supabase.auth.getSession().then(({ data }) => {
    if (data.session) showEditor();
  });

  loginBtn.onclick = async () => {
    const email = prompt("Enter your email:");
    if (!email) return;
    const { error } = await supabase.auth.signInWithOtp({ email });
    if (error) return alert(error.message);
    alert("Check your email for the login link.");
  };

  logoutBtn.onclick = async () => {
    await supabase.auth.signOut();
    hideEditor();
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
    saveBtn.style.display = "none";
  };

  // --- Editor functions ---
  function showEditor() {
    document.querySelectorAll("[data-field]").forEach(el => {
      el.setAttribute("contenteditable", "true");
      el.style.border = "1px dashed var(--accent-soft)";
      el.style.padding = "0.5rem";
    });
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
    saveBtn.style.display = "inline-block";
  }

  function hideEditor() {
    document.querySelectorAll("[data-field]").forEach(el => {
      el.removeAttribute("contenteditable");
      el.style.border = "";
      el.style.padding = "";
    });
  }

  // --- Save changes ---
  saveBtn.onclick = async () => {
    const updates = {};
    document.querySelectorAll("[data-field]").forEach(el => {
      updates[el.dataset.field] = el.innerHTML;
    });
    updates.footer = document.getElementById("footer").innerHTML;

    const { data, error } = await supabase
      .from("content")
      .update(updates)
      .eq("id", 1); // assuming your content row has id = 1

    if (error) {
      alert("Error saving changes: " + error.message);
      console.error(error);
    } else {
      alert("Changes saved successfully!");
    }
  };
</script>

</body>
</html>
